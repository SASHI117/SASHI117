<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img"
  aria-label="Sashi Vardhan Pragada, AI/ML engineer. An animated speech waveform turns into the greeting hello in six languages.">
<style>
  .bar { transform-box: fill-box; transform-origin: center; animation: talk 1.4s ease-in-out infinite alternate; }
  @keyframes talk { from { transform: scaleY(.22); } to { transform: scaleY(1); } }
  .tok { opacity: 0; animation: tok 7s ease-in-out infinite; }
  @keyframes tok { 0%, 12% { opacity: 0; transform: translateX(-14px); } 22%, 80% { opacity: 1; transform: translateX(0); } 92%, 100% { opacity: 0; } }
  .arrow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bar, .tok, .arrow, .cursor { animation: none; opacity: 1; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0a0a"/><stop offset="1" stop-color="#141414"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" x2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity=".035"/>
  </pattern>
  <clipPath id="frame"><rect width="1200" height="330" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="330" fill="url(#bg)"/>
  <rect width="1200" height="330" fill="url(#dots)"/>
</g>
<text x="60" y="92" style="font:700 54px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" fill="#fafafa">Sashi Vardhan Pragada</text>
<text x="62" y="134" style="font:500 22px 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" fill="#d4d4d8">AI/ML engineer · speech systems · LLMs &amp; RAG · real-time inference on CPUs</text>
<text x="62" y="168" style="font:500 15px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#8a8a93">Hyderabad, India  ·  AUDICLABS  ·  previously FarmVaidya.ai<tspan class="cursor" fill="#22d3ee"> ▍</tspan></text>
