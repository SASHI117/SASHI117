  <linearGradient id="acc" x1="0" x2="1">
    <stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#0f172a" opacity=".05"/>
  </pattern>
  <clipPath id="frame"><rect width="1200" height="232" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="232" fill="url(#bg)"/>
  <rect width="1200" height="232" fill="url(#dots)"/>
</g>
<text x="40" y="44" style="font:600 13px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing:2px" fill="#64748b">THE PIPELINE I KEEP BUILDING, ONE STAGE AT A TIME</text>
